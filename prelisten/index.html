<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Я ЖИВА</title>
<script>
  // relative paths need a trailing slash: /prelisten → /prelisten/
  (function () { var p = location.pathname; if (!/\/$/.test(p) && !/\.[a-z0-9]+$/i.test(p)) location.replace(p + '/' + location.search + location.hash); })();
  // surface load failures instead of a silent black screen
  window.__fail = function (msg) { var t = document.getElementById('loading-text'); if (t) { t.style.display = 'block'; t.textContent = msg; } };
  window.addEventListener('error', function (e) { if (e.target && (e.target.src || e.target.href)) window.__fail('Не завантажився файл: ' + (e.target.src || e.target.href)); else if (e.message) window.__fail(e.message); }, true);
  window.addEventListener('unhandledrejection', function (e) { window.__fail(String(e.reason && e.reason.message || e.reason)); });
  setTimeout(function () { var l = document.getElementById('loading'); if (l && !l.classList.contains('ready')) window.__fail('Сцена не запустилась. Відкрийте консоль браузера (F12), щоб побачити помилку.'); }, 25000);
</script>

<style>
  html, body { margin: 0; height: 100%; background: #060403; overflow: hidden; }
  a { color: #e8dcc4; } a:hover { color: #fff; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 45%, rgba(8,4,2,.55) 100%); }
  #grain { position: fixed; inset: 0; pointer-events: none; opacity: .06; mix-blend-mode: overlay; background-size: 200px 200px; }
  #hint { position: fixed; left: 50%; bottom: 38px; transform: translate(-50%, 6px); max-width: 80vw; text-align: center; pointer-events: none;
    font: 400 13px/1.5 "IBM Plex Mono", monospace; letter-spacing: .04em; color: #e8dcc4; opacity: 0; transition: opacity .6s, transform .6s; text-shadow: 0 1px 8px rgba(0,0,0,.8); text-wrap: pretty; }
  #hint.on { opacity: .82; transform: translate(-50%, 0); }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #0b0806; transition: opacity 1.6s ease; z-index: 5; }
  #loading.gone { opacity: 0; pointer-events: none; }
  #reel { width: 56px; height: 56px; background: url(assets/loader.png) center / contain no-repeat; opacity: .55; animation: spin 2.4s linear infinite; }
  #loading-text { display: none; font: 400 12px "IBM Plex Mono", monospace; color: #a8988a; max-width: 80vw; text-align: center; line-height: 1.6; }
  #loading.ready #reel { animation-duration: 6s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #debug { position: fixed; left: 12px; top: 10px; font: 11px "IBM Plex Mono", monospace; color: #c9b9a4; display: none; pointer-events: none; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="grain"></div>
<div id="hint"></div>
<div id="debug"></div>
<div id="loading"><div id="reel"></div><div id="loading-text"></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
